name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Check syntax del servidor (todos los .js)
        run: |
          find server -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check
          echo "✅ $(find server -name '*.js' -not -path '*/node_modules/*' | wc -l) archivos del servidor compilan"

      - name: Check JavaScript del cliente (index.html, sw.js, compatibilidad iPhone)
        run: node scripts/check-client.js

      - name: Verify required env vars documented
        run: |
          test -f server/.env.example && echo "✅ .env.example existe" || (echo "❌ Falta .env.example" && exit 1)
